name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      - run: ruff check src tests api
      - run: ruff format --check src tests api

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install CPU PyTorch
        run: pip install --index-url https://download.pytorch.org/whl/cpu torch torchvision
      - name: Install project
        run: pip install -e . pytest httpx fastapi python-multipart pillow
      - name: Unit tests (synthetic data, includes a tiny training run)
        run: pytest -v
        env:
          MLFLOW_TRACKING_URI: sqlite:///mlflow.db

  validate-pipeline:
    # Checks that dvc.yaml and params.yaml are consistent, without downloading data.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install dvc
      - run: dvc stage list
